name: validate

on:
  push:
  pull_request:

jobs:
  startup-static-checks:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell, JSON and Python helpers
        run: make validate
